name: Publish QSEEG v1.0.2

on:
  push:
    branches: [main]
    paths: [.github/workflows/release-v1.0.2.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qseeg-release-v1.0.2
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Build verified computational bundle
        run: python tools/build_release.py
      - name: Check archive checksum
        run: diff CHECKSUMS.txt dist/SHA256SUMS.txt
      - name: Publish versioned bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create v1.0.2 dist/QSEEG_code.zip dist/SHA256SUMS.txt --target "$GITHUB_SHA" --title "QSEEG v1.0.2" --notes-file docs/releases/v1.0.2.md
